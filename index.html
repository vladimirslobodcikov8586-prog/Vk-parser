
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VK Feed Pulse — Панель управления</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        h1 {
            font-size: 1.15rem;
            font-weight: 700;
        }

        .status-badge {
            font-size: 0.7rem;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 3px 8px;
            border-radius: 10px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: inline-block;
        }

        .input-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        .btn-add {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 16px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .message {
            font-size: 0.8rem;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }

        .message.success { display: block; background: rgba(34, 197, 94, 0.1); color: #4ade80; }
        .message.error { display: block; background: rgba(239, 68, 68, 0.1); color: #f87171; }

        .groups-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 12px;
            padding-top: 12px;
            border-top: 1px solid #1f2937;
        }

        .groups-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
        }

        .group-item {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-link {
            color: #60a5fa;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .btn-del {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-del:hover {
            background: rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="brand">
            <div class="header-icon">📡</div>
            <div>
                <h1>VK Feed Pulse</h1>
                <span class="status-badge">● Live Server</span>
            </div>
        </div>
    </div>

    <div class="input-box">
        <input type="text" id="groupInput" placeholder="Имя группы или ссылка...">
        <button class="btn-add" id="addBtn" onclick="sendGroup()">Добавить</button>
    </div>

    <div id="statusMessage" class="message"></div>

    <div class="groups-header">
        <span>Отслеживаемые паблики</span>
        <span id="groupCount">0</span>
    </div>

    <ul id="groupsList" class="groups-list">
        <li style="color: #6b7280; font-size: 0.85rem;">Загрузка списка...</li>
    </ul>
</div>

<script>
    const SERVER_URL = "https://vk-parser-xhkd.onrender.com/api/groups";

    async function loadCurrentGroups() {
        try {
            const response = await fetch(SERVER_URL);
            if (response.ok) {
                const data = await response.json();
                renderGroups(data.groups);
            }
        } catch (err) {
            document.getElementById("groupsList").innerHTML = '<li style="color: #f87171; font-size: 0.85rem;"> Ошибка сети с Render</li>';
        }
    }

    function renderGroups(groups) {
        const listEl = document.getElementById("groupsList");
        document.getElementById("groupCount").innerText = groups ? groups.length : 0;

        if (!groups || groups.length === 0) {
            listEl.innerHTML = '<li style="color: #6b7280; font-size: 0.85rem;">Список пуст</li>';
            return;
        }

        listEl.innerHTML = groups.map(g => `
            <li class="group-item">
                <a class="group-link" href="https://vk.com/${g}" target="_blank">vk.com/${g}</a>
                <button class="btn-del" onclick="deleteGroup('${g}')" title="Удалить">×</button>
            </li>
        `).join('');
    }

    async function sendGroup() {
        const input = document.getElementById("groupInput");
        const groupValue = input.value.trim();

        if (!groupValue) return;

        try {
            const response = await fetch(SERVER_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ group: groupValue })
            });

            const result = await response.json();
            if (response.ok && result.status === "ok") {
                input.value = "";
                renderGroups(result.groups);
                showMessage("Паблик добавлен!", "success");
            } else {
                showMessage("Уже есть в списке", "error");
            }
        } catch (err) {
            showMessage("Ошибка отправки", "error");
        }
    }

    async function deleteGroup(groupName) {
        try {
            const response = await fetch(SERVER_URL, {
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ group: groupName })
            });

            const result = await response.json();
            if (response.ok && result.status === "deleted") {
                renderGroups(result.groups);
                showMessage("Паблик удалён", "success");
            }
        } catch (err) {
            showMessage("Ошибка удаления", "error");
        }
    }

    function showMessage(text, type) {
        const msg = document.getElementById("statusMessage");
        msg.innerText = text;
        msg.className = `message ${type}`;
        setTimeout(() => { msg.className = "message"; }, 3000);
    }

    loadCurrentGroups();
</script>

</body>
</html>
